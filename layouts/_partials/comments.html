{{- if not .Params.disable_comments -}}
<section
    class="comments-section"
    style="
        margin-top: 3rem;
        padding-top: 2rem;
        border-top: 1px solid var(--color-divider);
    "
>
    <script
        src="https://giscus.app/client.js"
        data-repo="unnobatroo/jismailov-com"
        data-repo-id="R_kgDOS03y3Q"
        data-category="General"
        data-category-id="DIC_kwDOS03y3c4DF1LC"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="0"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="en"
        crossorigin="anonymous"
        async
    ></script>
    {{- with resources.Get "js/giscus.ts" | js.Build | resources.Minify |
    resources.Fingerprint "sha256" }}
    <script
        defer
        src="{{ .RelPermalink }}"
        integrity="{{ .Data.Integrity }}"
    ></script>
    {{- end }}
</section>
{{- end -}}
