baseURL = "https://jismailov.com/"
title   = "jismailov"
theme   = "hugo-mini"

defaultContentLanguage                = "en"
defaultContentLanguageInSubdirectory   = false

enableRobotsTXT = true

[params]
  description = "Finding myself in different places, sometimes by choice."
  authorName = "Jaloliddin Ismailov"
  authorURL  = "https://jismailov.com/"
  copyrightYear = 2026
  recentSidebarCount = 5
  socialSharing = false

  [params.social]
    email     = "me@jismailov.com"
    github    = "https://github.com/unnobatroo"
    linkedin  = "https://linkedin.com/in/jismailov"
    goodreads = "https://www.goodreads.com/unnobatroo"

[permalinks]
  blog = "/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

